<div>
    <h2>Lista de Clientes</h2>
    <div class="row">
        <div class="col-md-4" *ngFor="let client of clients">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ client.client_name }}</h5>
                    <button class="btn btn-primary" (click)="viewClientDetails(client.id)">Ver Detalhes</button>
                </div>
            </div>
        </div>
    </div>
</div>
